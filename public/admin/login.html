<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin Login</title>
  <link rel="stylesheet" href="/styles.css"/>
  <link rel="icon" href="/favicon.ico"/>
  <style>
    body{
      background: #f8faff;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .landing{
      width:100%;
      max-width:460px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius:18px;
      box-shadow: 0 20px 40px rgba(175, 175, 175, 0.45);
      padding:28px;
      backdrop-filter: blur(10px);
    }
    .logoWrap{
      display:flex;
      justify-content:center;
      margin: 60px 0 18px;
    }
    .logoWrap img{
      width:250px;
      height:auto;
      display:block;
    }
    .title{
      text-align:center;
      margin: 0 0 18px;
    }
    .title h1{ margin:0; font-size:20px; }
    .title p{ margin:8px 0 0; opacity:0.8; }
    .btnRow{ display:flex; gap:10px; }
    .btnRow button{ flex:1; }
    .note{ margin-top:12px; opacity:0.75; font-size:12px; text-align:center; }
    .seedCreds{
      margin-top:14px;
      border:1px solid #d8e6ff;
      border-radius:10px;
      padding:10px 12px;
      background:#f3f8ff;
      font-size:12px;
    }
    .seedCreds h3{
      margin:0 0 8px;
      font-size:13px;
    }
    .seedCreds .row{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin:3px 0;
    }
  </style>
</head>
<body>

  <div class="landing">
    <div class="logoWrap">
      <img src="/img/logo.png" alt="Logo"/>
    </div>

    <div class="title">
      <h1>Admin Login</h1>
      <p>Use your admin credentials to access the panel.</p>
    </div>

    <label>Username</label>
    <input id="username" class="mono" placeholder="admin" autocomplete="username"/>

    <label>Password</label>
    <input id="password" type="password" class="mono" placeholder="********" autocomplete="current-password"/>

    <div class="btnRow" style="margin-top:12px">
      <button id="loginBtn" class="primary">Log in</button>
      <button id="logoutBtn" style="display:none">Log out</button>
    </div>

    <div id="msg" class="notice" style="display:none; margin-top:12px"></div>
    <div class="seedCreds mono">
      <h3>Admin Accounts</h3>
      <div class="row"><span>admin1</span><span>AS8549D1ASD0</span></div>
      <div class="row"><span>admin2</span><span>A8S97D401AS0</span></div>
      <div class="row"><span>admin3</span><span>ASD129AS5D04</span></div>
      <div class="row"><span>admin4</span><span>AS1D0AS8D40D</span></div>
      <div class="row"><span>admin5</span><span>ASD410A85SD0</span></div>
    </div>
    <!-- <div class="note">If you are a candidate, open the exam link you received.</div> -->
  </div>

<script type="module" src="/admin/login.js"></script>
</body>
</html>
